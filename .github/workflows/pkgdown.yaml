# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
# NOTE: the '_develop' branch filter is intentional - it disables CI on
# 'develop'. Running the full matrix on every develop push is too heavy.
# Run devtools::check() locally before merging into develop.
on:
  push:
    branches: [main, _develop]
  pull_request:
    branches: [main, _develop]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      isPush: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4

      # pkgdown renders every *.md at the repo root into a page of the site,
      # skipping only a list hardcoded in pkgdown:::package_mds() - README,
      # NEWS, LICENSE, the issue templates and cran-comments. There is no
      # config hook, so CLAUDE.md became a public page at /CLAUDE.html.
      # Delete it from the checkout instead of deleting the built page:
      # deploy_to_branch() builds and pushes in one call, so there is no
      # step between the two to clean up in. Anything else added at the root
      # with a .md extension will need the same treatment.
      - name: Keep internal notes off the website
        run: rm -f CLAUDE.md

      - uses: r-lib/actions/setup-tinytex@v2

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Install package
        run: R CMD INSTALL .

      - name: Build and deploy pkgdown site
        if: contains(env.isPush, 'true')
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          Rscript -e 'pkgdown::deploy_to_branch(new_process = FALSE)'

