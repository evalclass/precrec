        href: articles/howto-multiple-models.html
      - text: Average over several test sets
        href: articles/howto-multiple-test-sets.html
      - text: Evaluate cross-validation folds
        href: articles/howto-cross-validation.html
      - text: Evaluate more than two classes
        href: articles/howto-multiclass.html
      - text: Work with large datasets
        href: articles/howto-large-datasets.html
      - text: Get the numbers out
        href: articles/howto-results-as-data.html
      - text: Balanced and imbalanced data
        href: articles/howto-imbalanced-data.html
    measures:
      text: Measures
      menu:
      - text: Measures overview
        href: articles/measures-overview.html
      - text: -------
      - text: Confusion-matrix rates
        href: articles/measures-confusion-matrix.html
      - text: Agreement and balance
