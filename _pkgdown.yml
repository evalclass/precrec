    contents:
    - "articles/metrics-overview"
    - "articles/metrics-confusion-matrix"
    - "articles/metrics-agreement"
    - "articles/metrics-ranking-cost"
    - "articles/metrics-auc"
    - "articles/metrics-probability"
    - "articles/metrics-classification-report"
    - "articles/metrics-uncertainty"
    - "articles/metrics-other-tools"
  - title: Plots
    navbar: ~
