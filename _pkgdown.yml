url: https://evalclass.github.io/precrec

repo:
  branch: main

template:
  bootstrap: 5
  bootswatch: cerulean

reference:
  - title: Package
    contents:
    - precrec
  - title: Main
    contents:
    - evalmod
    - metric_curve
  - title: Data preparation
    contents:
    - mmdata
    - join_scores
    - join_labels
    - format_nfold
    - create_sim_samples
  - title: Visualization
    contents:
    - plot
    - autoplot
    - fortify
  - title: Data retrieval
    contents:
    - as.data.frame
    - as.data.table
    - auc
    - pauc
  - title: Partial AUC and partial curve
    contents:
    - part
  - title: Confidence interval of AUC scores
    contents:
    - auc_ci
    - auc_boot
    - auc_diff
  - title: Precision-recall break-even point
    contents:
    - prbe
  - title: Average precision
    contents:
    - average_precision
  - title: Probability-based metrics
    contents:
    - prob_metrics
    - prob_metrics_ci
  - title: Classification report
    contents:
    - classification_report
  - title: Datasets
    desc: P10N10, B500, B1000, IB500, IB1000, M2N50F5 and C3N150
    contents:
    - P10N10
    - B500
    - B1000
    - IB500
    - IB1000
    - M2N50F5
    - C3N150

articles:
  - title: Get started
    navbar: ~
    contents:
    - "introduction"
  - title: How-to
    navbar: ~
    contents:
    - "articles/howto-prepare-data"
    - "articles/howto-multiple-models"
    - "articles/howto-multiple-test-sets"
    - "articles/howto-cross-validation"
    - "articles/howto-multiclass"
    - "articles/howto-large-datasets"
    - "articles/howto-results-as-data"
    - "articles/howto-imbalanced-data"
  - title: Metrics
